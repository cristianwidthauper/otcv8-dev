name: Build win (GL only)
on: [workflow_dispatch]

jobs:
  Windows:
    name: Build windows GL
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Setup MSBuild and add to PATH
      uses: microsoft/setup-msbuild@v2
      id: setup_msbuild

    # Samera 2026-07-14: o vcpkg pinado (3b3bd42) exige 7zip 21.7.0 e baixa de
    # https://www.7-zip.org/a/7z2107-extra.7z -> que virou 404 (tiraram a versao antiga do ar),
    # quebrando o build sozinho. Em vez de bumpar o vcpkg (arrastaria 4 anos de boost/openssl e
    # provavelmente quebraria o build do OTCv8), pre-semeamos o download: o vcpkg confere o SHA512,
    # entao pegamos os bytes ORIGINAIS do web.archive.org (hash verificado 648d8949...c848) e
    # apontamos VCPKG_DOWNLOADS pra ca. Assim ele acha o arquivo e nem tenta a URL morta.
    - name: Pre-seed 7zip (contorna o 404 do 7-zip.org)
      shell: pwsh
      run: |
        $dl = "${{ runner.workspace }}\vcpkg-downloads"
        New-Item -ItemType Directory -Force -Path $dl | Out-Null
        $url = "https://web.archive.org/web/2022id_/https://www.7-zip.org/a/7z2107-extra.7z"
        Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile "$dl\7z2107-extra.7z"
        $want = "648d894940bcc29951752d7a8fd18c770ee8d4fd944e17f1a52588e51ca8f58375ba48514538f2e1387786fd812bb86f75fd6bdd0892685cdcafb2989942c848"
        $got = (Get-FileHash -Algorithm SHA512 "$dl\7z2107-extra.7z").Hash.ToLower()
        if ($got -ne $want) { Write-Error "sha512 do 7zip nao bate: $got"; exit 1 }
        Write-Host "7zip pre-semeado OK (sha512 confere)"
        "VCPKG_DOWNLOADS=$dl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    # Samera 2026-07-14: o bzip2 chama vcpkg_fixup_pkgconfig -> precisa do pkg-config, que este vcpkg
    # baixa do MSYS2 com versao PINADA. Esses pacotes foram APAGADOS: repo.msys2.org e os 8 mirrors
    # dao 404, e o libwinpthread-git sumiu ate do web.archive.org (nao da pra pre-semear).
    # Escape hatch do proprio vcpkg (scripts/cmake/vcpkg_find_acquire_program.cmake:533): se a env
    # PKG_CONFIG estiver definida, ele usa ela e da 'return()' ANTES de chamar o vcpkg_acquire_msys.
    - name: Prover pkg-config (contorna os pacotes MSYS2 apagados)
      shell: pwsh
      run: |
        choco install pkgconfiglite -y --no-progress --allow-empty-checksums
        $pc = (Get-Command pkg-config.exe -ErrorAction SilentlyContinue).Source
        if (-not $pc) { Write-Error "pkg-config nao encontrado apos o choco install"; exit 1 }
        Write-Host "pkg-config em: $pc"
        "PKG_CONFIG=$pc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        # No Windows o vcpkg builda os ports num ambiente LIMPO/isolado (docs/users/triplets.md),
        # entao o PKG_CONFIG do runner NAO chega no portfile. VCPKG_KEEP_ENV_VARS repassa ele.
        "VCPKG_KEEP_ENV_VARS=PKG_CONFIG" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v7
      with:
        vcpkgDirectory: ${{ runner.workspace }}/vcpkg/
        vcpkgTriplet: x86-windows-static
        vcpkgGitCommitId: 3b3bd424827a1f7f4813216f6b32b6c61e386b2e
        vcpkgArguments: >
          boost-iostreams boost-asio boost-beast boost-system boost-variant boost-lockfree boost-process boost-program-options boost-uuid boost-filesystem
          luajit glew physfs openal-soft libogg libvorbis zlib libzip bzip2 openssl

    - name: Integrate vcpkg
      run: |
        ${{ runner.workspace }}/vcpkg/vcpkg integrate install

    - name: Compile otclient_gl
      timeout-minutes: 40
      run: |
        cd vc16
        MSBuild /property:Configuration=OpenGL /p:BUILD_REVISION=${{github.run_number}}

    - name: Upload binaries
      uses: 'actions/upload-artifact@v4'
      with:
        name: Download-binaries
        path: |
          otclient_gl.exe
        if-no-files-found: error
